# Practice 1 - Docker Compose stack for the Data Engineering course.
#
# Services:
#   db       Postgres 16.4, the target database
#   py       Python 3.12.5 client used to pull data from the REST API
#   pgadmin  pgAdmin 8.10 web UI for inspecting the database
#
# Every variable below has an inline default, so this file also runs
# standalone without the accompanying .env file.

name: practice1

services:
  db:
    image: postgres:16.4
    container_name: practice1-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-data_engineer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-data_engineer}
      POSTGRES_DB: ${POSTGRES_DB:-practice1}
      # Same values as PG* so that psql inside the container needs no flags.
      PGUSER: ${POSTGRES_USER:-data_engineer}
      PGPASSWORD: ${POSTGRES_PASSWORD:-data_engineer}
      PGDATABASE: ${POSTGRES_DB:-practice1}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume instead of a bind mount: the data directory stays out of
      # the repository and keeps its Linux ownership on macOS and Windows.
      - pgdata:/var/lib/postgresql/data
      - ./sql:/sql:ro
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-data_engineer} -d ${POSTGRES_DB:-practice1}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  py:
    image: python:3.12.5-bookworm
    container_name: practice1-py
    restart: unless-stopped
    working_dir: /app
    environment:
      API_URL: ${API_URL:-https://randomuser.me/api/}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-data_engineer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-data_engineer}
      POSTGRES_DB: ${POSTGRES_DB:-practice1}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    volumes:
      - ./python:/app
    # Dependencies are pinned here rather than read from a mounted
    # requirements.txt so that this file stays self-contained.
    command: >
      bash -c "pip install --no-cache-dir --root-user-action=ignore
      'sqlalchemy>=2.0.34' 'psycopg2-binary>=2.9.9' 'requests>=2.32.3' &&
      echo 'python client ready' && sleep infinity"
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:8.10
    container_name: practice1-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-pgadmin}
      # Single local user, so skip the extra master password prompt.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin:
